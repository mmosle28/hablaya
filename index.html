<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Habla Ya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habla Ya">
<meta name="theme-color" content="#2F4BE0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a training app. Home shows your weight and one big Train button; a session centers on the partner's voice with your answer pinned to the bottom. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#15202B; --muted:#5B6875; --line:#D7DDE4;
  --accent:#2F4BE0; --accent-ink:#FFFFFF; --sun:#F5B82E; --good:#1F9D63; --bad:#D2453A; --soft:#E3E8FB;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#18202A; --ink:#EAF0F6; --muted:#93A1AF; --line:#2A3542;
  --accent:#7C93FF; --accent-ink:#0F141A; --sun:#F5C452; --good:#3CC48A; --bad:#F06A5E; --soft:#212C45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#18202A; --ink:#EAF0F6; --muted:#93A1AF; --line:#2A3542;
  --accent:#7C93FF; --accent-ink:#0F141A; --sun:#F5C452; --good:#3CC48A; --bad:#F06A5E; --soft:#212C45; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 24px}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;min-height:52px}
.bar h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.hint{font-size:15px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:15px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
/* home */
.weight{display:grid;gap:4px;padding-block:18px 6px}
.weight .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.weight .n{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.weight .n small{font-size:26px;color:var(--muted);font-weight:700;letter-spacing:0}
.plates{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;margin-top:10px}
.plates i{height:16px;border-radius:2px;background:var(--line)}
.plates i.on{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.go{margin-top:16px;width:100%;text-align:left;border:0;border-radius:22px;padding:20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;gap:6px}
.go:disabled{opacity:.5;cursor:default}
.go .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.go .t{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.05}
.go .s{opacity:.92;font-size:15px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;width:100%}
.mode .e{font-size:26px;flex:none;width:40px;text-align:center}
.mode .tx{flex:1;min-width:0}.mode b{font-family:var(--f-display);font-size:18px;display:block}.mode .tx span{color:var(--muted);font-size:15px}
.modes{display:grid;gap:10px}
.dots{display:flex;gap:5px;margin-top:4px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--good)}.dots i.now{background:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}
.chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart.w div{background:var(--good)}
/* session */
.goalrow{display:flex;align-items:center;gap:10px;justify-content:center}
.goal{display:flex;gap:6px}
.goal i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.goal i.on{background:var(--good)}
.stage{display:grid;justify-items:center;gap:12px;padding-block:6px;text-align:center}
.orb{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent));display:grid;place-items:center;font-size:40px;color:var(--accent-ink);box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 35%,transparent);border:0;cursor:pointer}
.orb.think{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--sun) 60%,#fff),var(--sun))}
.orb.you{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--good) 55%,#fff),var(--good))}
.orb.listen{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bad) 55%,#fff),var(--bad))}
@media (prefers-reduced-motion:no-preference){.orb.talk,.orb.listen{animation:breathe 1.1s ease-in-out infinite}.orb.think{animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.07)}}}
.state{font-family:var(--f-display);font-weight:700;font-size:18px}
.said{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.25;max-width:28ch;text-wrap:balance}
.blur{filter:blur(7px);user-select:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pic{display:grid;justify-items:center;gap:2px;background:var(--soft);border-radius:14px;padding:8px 12px;border:0;cursor:pointer}
.pic .p{font-size:28px;line-height:1.1}.pic .w{font-size:14px;font-weight:700}
.pics.big .p{font-size:40px}
.mine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rescue{background:color-mix(in srgb,var(--sun) 16%,var(--surface));border:1.5px solid var(--sun);border-radius:18px;padding:14px;display:grid;gap:10px}
.rescue .es{font-family:var(--f-display);font-size:22px;font-weight:700}
.kit{display:grid;gap:8px}
.composer{position:sticky;bottom:0;z-index:4;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;border-top:1px solid var(--line);margin-top:12px}
.rowc{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:none}
.rowc textarea{flex:1;min-width:0}
.send{flex:none;width:58px;height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:22px}
.send:disabled{opacity:.5}
.micb{flex:none;width:58px;height:54px;border:0;border-radius:14px;background:var(--good);color:#fff;cursor:pointer;font-size:22px}
.micb.on{background:var(--bad)}
.btn{border:0;border-radius:14px;padding:15px;font-family:var(--f-display);font-weight:700;font-size:17px;cursor:pointer;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.big{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
.up{text-align:center;display:grid;gap:12px;padding-block:30px}
.up .n{font-family:var(--f-display);font-size:80px;font-weight:800;line-height:1;color:var(--good)}
.speeds{display:flex;gap:6px}
.speeds button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-size:14px;cursor:pointer}
.speeds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:14px}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ================= THE PROGRAM: 10 walk-up topics x 5 rungs = 50 lb =================
// Each topic comes with its pieces: chunks you build your own sentences from, linked to pictures, never English.
const TOPICS=[
 {k:"yo",e:"👋",t:"¿Quién eres?",kit:[["Me llamo","🏷️🙋"],["Mucho gusto","🤝😊"],["Soy de","🙋🗺️"],["Vivo en","🙋🏠"],["Tengo ... años","🎂"],["¿Y tú?","➡️🫵"],["¿Cómo te llamas?","🏷️🫵❓"],["¿De dónde eres?","🗺️🫵❓"]]},
 {k:"lugar",e:"🗺️",t:"Donde vives",kit:[["Crecí en","👶🗺️"],["Ahora vivo en","🙋🏠"],["Me gusta vivir aquí","❤️🏠"],["Hace calor","🥵"],["Llueve mucho","🌧️"],["Es bonito","😍"],["Es tranquilo","😌"],["Hay mucho tráfico","🚗🚗🚗"]]},
 {k:"dia",e:"☀️",t:"Mi día",kit:[["Me levanto","🛏️⬆️"],["temprano","🌅"],["tarde","🌙"],["Voy a clase","🚶🏫"],["Trabajo","💼"],["Como","🍽️"],["Estoy cansado","😴"],["Después","➡️⏰"]]},
 {k:"gustos",e:"❤️",t:"Lo que me gusta",kit:[["Me gusta","❤️"],["Me encanta","😍"],["No me gusta","👎"],["la música","🎵"],["la comida","🍕"],["caminar","🚶"],["ver películas","🎬"],["¿Qué te gusta?","❤️🫵❓"]]},
 {k:"escuela",e:"🎓",t:"Escuela y trabajo",kit:[["Estudio","📚"],["en la universidad","🏫"],["Me gradúo en diciembre","🎓🎄"],["Trabajo en","💼📍"],["Tengo un negocio","🏪🙋"],["Vendo ropa","👕💵"],["Es difícil","😓"],["¿A qué te dedicas?","💼🫵❓"]]},
 {k:"familia",e:"👨‍👩‍👧",t:"Familia",kit:[["Tengo","🙋🤲"],["un hermano","👦"],["una hermana","👧"],["Mi mamá","👩"],["Mi papá","👨"],["Viven en","🏠🗺️"],["Los extraño","💭❤️"],["¿Tienes hermanos?","👦👧🫵❓"]]},
 {k:"finde",e:"🎉",t:"El fin de semana",kit:[["Este fin de semana","📅🎉"],["Voy a","🔜"],["salir con amigos","👫🌃"],["descansar","😌🛋️"],["Nada especial","🤷"],["Tal vez","🤔"],["¿Quieres ir?","🫵🚶❓"],["¿Qué vas a hacer?","🫵🔜❓"]]},
 {k:"ayer",e:"⏪",t:"Lo que pasó",kit:[["Ayer","⏪"],["fui a","⏪🚶"],["comí","⏪🍽️"],["vi","⏪👀"],["Hablé con","⏪🗣️"],["Fue divertido","⏪😄"],["Estaba cansado","⏪😴"],["¿Qué hiciste?","⏪🫵❓"]]},
 {k:"comida",e:"🌮",t:"Comer y tomar",kit:[["Tengo hambre","🤤"],["Quiero","🙏"],["¿Qué me recomiendas?","👉⭐❓"],["Está muy rico","😋"],["Para llevar","🛍️"],["con","➕"],["sin","➖"],["La cuenta, por favor","🧾🙏"]]},
 {k:"planes",e:"🚀",t:"Planes y sueños",kit:[["Quiero","🙏"],["Me gustaría","💭🙏"],["viajar a","✈️"],["algún día","🔮"],["el año que viene","📅🔜"],["Mi meta es","🎯"],["Voy a","🔜"],["¿Y tú?","➡️🫵"]]}
];
const RESCUE=[["¿Cómo se dice...?","🗣️❓"],["Más despacio, por favor","🐢🙏"],["Otra vez, por favor","🔁🙏"],["No entiendo","👂❌"]];
const RUNGS=[
 {n:"Escucha",need:5,rate:.78,how:"Escucha y contesta con una palabra.",
  style:"You do most of the talking. Each turn: one very short sentence about yourself on the topic, then a yes/no or this-or-that question the learner can answer with ONE word (example: ¿Te gusta el café? ¿Sí o no? / ¿Café o té?). Max 6 words per sentence. Only very common words. Repeat key words from the pieces a lot."},
 {n:"Contesta",need:5,rate:.82,how:"Contesta en español. Dos o tres palabras está bien.",
  style:"Ask ONE simple open question about the learner on the topic (like ¿De dónde eres? ¿Qué te gusta?). Max 6 words. When they answer, react in 2 to 4 words, then ask the next simple question. Use words from the pieces."},
 {n:"Tu versión",need:3,rate:.85,how:"Cuéntale de ti. Tres o más frases cortas.",
  style:"Ask the learner to tell you about themselves on this topic. When they answer, react warmly in one short sentence and push for more: ¿Y qué más? ¿Por qué? Max 8 words per sentence."},
 {n:"Conversación",need:6,rate:.88,how:"Una conversación de verdad. Que no se muera.",
  style:"Have a real back and forth on the topic: react to what they said, share a little about yourself, then ask something. 2 short sentences, max 8 words each, slow and clear."},
 {n:"Velocidad",need:6,rate:1.05,how:"Igual, pero a velocidad normal.",
  style:"Real conversation at natural casual speed and length: 2 or 3 sentences, natural expressions and fillers (pues, la verdad, o sea). Share about yourself, react, ask."}
];
const MAXLB=TOPICS.length*RUNGS.length;

// ================= STATE =================
const KEY="hablaya.v3";
const blank=()=>({passed:{},prog:{},sessions:[],phrases:[],days:{},updated:0,rate:1,showText:false,hands:true,gkey:"",gmodel:""});
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
let DOC=null,saving=false,again=false,saveT=null;
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(push,1500)}
async function push(){if(!DOC)return;if(saving){again=true;return}saving=true;
 try{S.sessions=S.sessions.slice(-60);S.phrases=S.phrases.slice(-300);const c=JSON.parse(JSON.stringify(S));delete c.gkey;await DOC.set(c)}catch(e){}
 saving=false;if(again){again=false;push()}}
const inClaude=!!(window.claude&&window.claude.use);
(async()=>{try{if(!inClaude)return;const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
 const id=await user.id();if(!id)return;DOC=db.doc("data/users/"+id+"/trainer");const snap=await DOC.get();
 if(snap.exists){const r=snap.data();if((r.updated||0)>=(S.updated||0)){const k=S.gkey;S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));S.gkey=k;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}else push()}else if(S.updated)push();
 if(screen==="home")render()}catch(e){}})();

const today=()=>new Date().toLocaleDateString("en-CA");
const lb=()=>Object.keys(S.passed).length;
function cur(){for(let t=0;t<TOPICS.length;t++)for(let r=0;r<RUNGS.length;r++)if(!S.passed[t+"-"+r])return{t,r};return null}
function streak(){let n=0,d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);while(S.days[d.toLocaleDateString("en-CA")]){n++;d.setDate(d.getDate()-1)}return n}
function addPhrase(es,chunks){es=String(es||"").trim();if(!es)return;const n=norm(es);if(S.phrases.find(p=>norm(p.es)===n))return;S.phrases.push({es,chunks:chunks||null,d:today()})}

// ================= AI: Claude inside the Claude app, otherwise your free Gemini key =================
let sample=null,aiReady=!inClaude;
if(inClaude){try{claude.use("sample").then(s=>{sample=s;aiReady=true;render()}).catch(()=>{aiReady=true;render()})}catch(e){aiReady=true}}
const haveAI=()=>!!sample||!!S.gkey;
function parseJSON(t){t=String(t||"").trim();try{return JSON.parse(t)}catch(e){}const m=t.match(/\{[\s\S]*\}/);if(m)try{return JSON.parse(m[0])}catch(e){}throw{code:"bad"}}
async function askJSON(system,turns,signal){
 const msgs=turns.length?turns:[{role:"user",content:"(Empieza.)"}];
 if(sample){const input=[{role:"user",content:system},...msgs];if(input[input.length-1].role!=="user")input.push({role:"user",content:"(Sigue.)"});return await sample.json(input,{modelTier:"quick",cache:false,signal})}
 if(!S.gkey)throw{code:"nokey"};if(!S.gmodel)await pickModel();
 const contents=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));if(contents[0].role!=="user")contents.unshift({role:"user",parts:[{text:"(Empieza.)"}]});
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.gmodel}:generateContent?key=${encodeURIComponent(S.gkey)}`,{method:"POST",signal,headers:{"content-type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{responseMimeType:"application/json",temperature:.8}})});
 if(!r.ok)throw{code:r.status===429?"rate_limited":(r.status===400||r.status===403)?"bad_key":"upstream"};
 const j=await r.json();return parseJSON((j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""))}
async function pickModel(){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(S.gkey)}`);if(!r.ok)throw{code:"bad_key"};
 const j=await r.json();const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/gemini/.test(m.name)&&!/(preview|exp|tts|image|live|audio|embed)/.test(m.name));
 const ver=n=>parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[,0])[1]);
 const lite=ok.filter(m=>/flash-lite/.test(m.name)).sort((a,b)=>ver(b.name)-ver(a.name)),flash=ok.filter(m=>/flash/.test(m.name)).sort((a,b)=>ver(b.name)-ver(a.name));
 const m=lite[0]||flash[0];if(!m)throw{code:"nomodel"};S.gmodel=m.name.replace(/^models\//,"");save()}
const errCopy={not_granted:"Habla Ya needs permission to use Claude. Reopen it and tap Allow.",rate_limited:"Too many messages, or today's free limit is used up. Wait a bit and try again.",session_expired:"Sign in again, then come back.",bad_key:"That Gemini key didn't work. Check it in Settings.",nokey:"Add your free Gemini key in Settings first.",nomodel:"Couldn't find a free Gemini model for this key."};
const errMsg=e=>errCopy[e&&e.code]||"Couldn't reach the AI. Check your internet and send again.";
const cleanChunks=a=>Array.isArray(a)&&a.length?a.filter(c=>c&&c.es).slice(0,7).map(c=>({es:String(c.es),pic:String(c.pic||"💬")})):null;

function system(){const t=TOPICS[X.t],r=RUNGS[X.r],done=Object.keys(S.passed).map(k=>TOPICS[+k.split("-")[0]].t);
 return `You are Sofi, 26, from Mexico City: a friendly, patient Spanish speaking friend. Your words are read aloud by text to speech.
The learner is a BEGINNER (Spanish 1 level): they understand very little spoken Spanish and freeze when speaking. You are their training partner. The only goal is getting them to speak Spanish and keep conversations going. Broken Spanish is GOOD. Never correct grammar. Never speak English, never translate.
Topic: ${t.t}. Pieces they can build with: ${t.kit.map(k=>k[0]).join(", ")}.
${X.free?`Free conversation mixing topics they've practiced: ${[...new Set(done)].join(", ")||t.t}.`:""}
Step: ${r.n}. ${r.style}
If they say "no entiendo", "otra vez" or "más despacio", or clearly didn't understand: repeat your idea shorter and simpler with different easier words.
If they ask "¿cómo se dice ...?", tell them the Spanish simply and invite them to use it.
Grade their LAST message (null for your opening line):
- "understood": did it show they understood your previous line? true/false
- "spanish_only": true if it had no English words (names and brands are fine; "no entiendo"/"otra vez" count as Spanish)
- "words": how many Spanish words they said
- "rescue": if it contained English words, the simple natural Spanish for their WHOLE message, split into chunks with emoji pictures. Otherwise null.
Reply with ONLY one JSON object:
{"reply": "your next line", "chunks": [{"es": "word group from your reply, in order", "pic": "1 to 3 emoji picturing it"}], "understood": null, "spanish_only": null, "words": 0, "rescue": null or {"es": "...", "chunks": [{"es": "", "pic": ""}]}}`}

// ================= VOICE OUT =================
let voice=null;const hasTTS="speechSynthesis" in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));voice=null;for(const p of["es-MX","es-US","es-419","es-ES"]){const v=vs.find(v=>v.lang.replace("_","-")===p);if(v){voice=v;break}}if(!voice)voice=vs[0]||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();if(screen==="home")render()}}
function speak(t,rate,then){if(!hasTTS||!t){then&&then();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"es-MX";if(voice)u.voice=voice;u.rate=(rate||1)*S.rate;
 u.onstart=()=>{if(X){X.talking=true;paint()}};u.onend=()=>{if(X){X.talking=false;paint()}then&&then()};u.onerror=()=>{if(X){X.talking=false;paint()}};speechSynthesis.speak(u)}
function unlockTTS(){if(!hasTTS)return;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const hush=()=>{if(hasTTS)speechSynthesis.cancel();if(X)X.talking=false};

// ================= VOICE IN =================
// On its own website the mic button works and can listen hands-free. Inside the Claude app the mic is blocked, so you use your keyboard's mic.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micOK=!!SR&&window.top===window.self,micOn=false,recog=null;
function listen(target,auto){if(!micOK)return;if(micOn){recog&&recog.stop();return}hush();
 try{recog=new SR();recog.lang="es-MX";recog.interimResults=true;let txt="";
  recog.onresult=e=>{txt=[...e.results].map(r=>r[0].transcript).join(" ").trim();const el=document.getElementById(target);if(el)el.value=txt;if(target==="dr")X.draft=txt;else X.rtyped=txt};
  recog.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){micOK=false}};
  recog.onend=()=>{micOn=false;paint();if(!txt){render();return}if(target==="dr")send();else rescueCheck()};
  micOn=true;recog.start();paint()}catch(e){micOn=false;if(!auto)micOK=false;render()}}

// ================= A TRAINING SESSION =================
let screen="home",X=null;
function startSet(t,r,free){unlockTTS();X={t,r,free:!!free,turns:[],busy:false,err:"",draft:"",talking:false,reveal:S.showText,pics:r<2,last:null,mine:"",count:free?0:(S.prog[t+"-"+r]||0),stats:{n:0,es:0,words:0,und:0,undn:0},t0:Date.now(),lastAct:Date.now(),rescue:null,pending:null,kit:r>=1&&r<=3,ctl:null};screen="set";render();scrollTo(0,0);turn()}
async function turn(){X.busy=true;X.err="";render();X.ctl=new AbortController();
 try{const r=await askJSON(system(),X.turns.slice(-20),X.ctl.signal);
  if(!r||typeof r.reply!=="string")throw{code:"bad"};
  const me=X.turns.length&&X.turns[X.turns.length-1].role==="user";
  const reply={es:r.reply,chunks:cleanChunks(r.chunks)};
  if(me){score(r);
   if(r.rescue&&r.rescue.es&&!r.spanish_only){X.rescue={es:String(r.rescue.es),chunks:cleanChunks(r.rescue.chunks),typed:"",tries:0,done:false};X.rtyped="";X.pending=reply;addPhrase(X.rescue.es,X.rescue.chunks);X.busy=false;save();render();speak(X.rescue.es,.8);return}}
  deliver(reply)}
 catch(e){X.busy=false;if(e&&e.code==="cancelled")return;if(e&&e.name==="AbortError")return;X.err=errMsg(e);if(e&&e.code==="not_granted")sample=null;if(screen==="set")render()}}
function score(r){const R=RUNGS[X.r];X.stats.n++;if(r.spanish_only)X.stats.es++;X.stats.words+=Math.max(0,+r.words||0);if(r.understood!==null&&r.understood!==undefined){X.stats.undn++;if(r.understood)X.stats.und++}
 let ok=false;if(X.r===0)ok=r.understood===true;else if(X.r===2)ok=!!r.spanish_only&&(+r.words||0)>=6;else ok=!!r.spanish_only&&r.understood!==false;
 if(ok&&!X.free)X.count++}
function deliver(reply){X.last=reply;X.turns.push({role:"assistant",content:reply.es});X.reveal=S.showText;X.busy=false;
 if(!X.free&&X.count>=RUNGS[X.r].need){render();speak(reply.es,RUNGS[X.r].rate,()=>pass());return}
 render();speak(reply.es,RUNGS[X.r].rate,()=>{if(S.hands&&micOK&&screen==="set"&&!X.rescue)listen("dr",true)})}
function send(){const v=(X.draft||"").trim();if(X.busy||X.rescue)return;if(!v){if(X.err)turn();return}
 hush();X.turns.push({role:"user",content:v});X.mine=v;X.draft="";const now=Date.now();S.days[today()]=(S.days[today()]||0)+Math.min((now-X.lastAct)/6e4,2);X.lastAct=now;turn()}
function rescueCheck(){const el=document.getElementById("ry");if(el)X.rtyped=el.value;X.rescue.tries++;X.rescue.score=sim(X.rtyped,X.rescue.es);render()}
function rescueDone(){const said=X.rtyped&&X.rescue.score>=.7?X.rtyped:X.rescue.es;X.turns[X.turns.length-1].content=said;X.mine=said;X.rescue=null;const p=X.pending;X.pending=null;deliver(p)}
function pass(){const key=X.t+"-"+X.r;finishStats();S.passed[key]=1;delete S.prog[key];save();screen="up";render();speak("¡Muy bien!",1)}
function finishStats(){if(X.saved)return;X.saved=1;if(!X.stats.n)return;S.sessions.push({d:today(),t:X.t,r:X.r,free:X.free,n:X.stats.n,es:X.stats.es,words:X.stats.words});save()}
function endSet(){hush();X.ctl&&X.ctl.abort();if(micOn&&recog){recog.onend=null;try{recog.abort()}catch(e){}micOn=false}finishStats();screen=X.stats.n?"recap":"home";render();scrollTo(0,0)}

// ================= HELPERS =================
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zñ ]/g,"").replace(/\s+/g," ").trim();
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;const m=[...Array(b.length+1)].map((_,i)=>[i]);for(let j=1;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(b[i-1]===a[j-1]?0:1));return 1-m[b.length][a.length]/Math.max(a.length,b.length)}
const chunkRow=(ch,big,words)=>`<div class="pics ${big?"big":""}">${ch.map(c=>`<button class="pic" data-say="${esc(c.es)}"><span class="p">${esc(c.pic)}</span>${words?`<span class="w">${esc(c.es)}</span>`:""}</button>`).join("")}</div>`;
const kitRow=list=>chunkRow(list.map(([es,pic])=>({es,pic})),false,true);
function recent(n){const s=S.sessions.filter(x=>x.n).slice(-n);return s}
const pct=s=>s.n?Math.round(s.es/s.n*100):0, wpt=s=>s.n?+(s.words/s.n).toFixed(1):0;

// ================= SCREENS =================
const app=document.getElementById("app");
function render(){({home,set:setScr,up,recap,program,settings,phrases})[screen]();
 const d=document.getElementById("dr");if(d){d.oninput=e=>{X.draft=e.target.value};d.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();X.draft=d.value;send()}}}
 const r=document.getElementById("ry");if(r){r.oninput=e=>{X.rtyped=e.target.value};r.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();rescueCheck()}}}}
const bar=(t,extra="")=>`<div class="bar"><button class="back" data-go="home" aria-label="Volver">←</button><h1>${t}</h1>${extra}</div>`;

function home(){const c=cur(),w=lb(),last=recent(1)[0],s7=recent(7),avgEs=s7.length?Math.round(s7.reduce((a,s)=>a+pct(s),0)/s7.length):0,avgW=s7.length?(s7.reduce((a,s)=>a+wpt(s),0)/s7.length).toFixed(1):"0";
 const need=!haveAI()&&aiReady;
 app.innerHTML=`<div class="weight"><span class="k">Tu peso</span><span class="n">${w}<small> / ${MAXLB} lb</small></span>
 <div class="plates">${Array.from({length:MAXLB},(_,i)=>`<i class="${i<w?"on":""}"></i>`).join("")}</div></div>
 <div class="stats"><div class="stat"><b>${avgEs}%</b><span>en español</span></div><div class="stat"><b>${avgW}</b><span>palabras por turno</span></div><div class="stat"><b>${streak()}</b><span>días seguidos</span></div></div>
 ${need?`<div class="card" style="margin-top:14px"><b>One step before you train</b><p class="hint">${inClaude?"Allow Habla Ya to use Claude when it asks.":"Add your free Gemini key so the partner can talk."}</p>${inClaude?"":`<button class="btn pri" data-go="settings">Add key</button>`}</div>`:""}
 ${c?`<button class="go" data-train ${haveAI()?"":"disabled"}><span class="k">Siguiente · ${TOPICS[c.t].e} ${TOPICS[c.t].t}</span><span class="t">Entrenar: ${RUNGS[c.r].n}</span><span class="s">${RUNGS[c.r].how} Meta: ${RUNGS[c.r].need} para subir 1 lb.</span></button>`
 :`<div class="card" style="margin-top:16px"><p class="big">50 lb. Lo hiciste.</p><p class="hint">Keep the weight with free conversations.</p></div>`}
 <div class="modes" style="margin-top:10px">
 ${w?`<button class="mode" data-free ${haveAI()?"":"disabled"}><span class="e">💬</span><span class="tx"><b>Charla libre</b><span>Mezcla todo lo que ya practicaste</span></span><span>›</span></button>`:""}
 <button class="mode" data-go="program"><span class="e">🏋️</span><span class="tx"><b>El programa</b><span>10 temas, 5 pasos cada uno</span></span><span>›</span></button>
 ${S.phrases.length?`<button class="mode" data-go="phrases"><span class="e">🧩</span><span class="tx"><b>Mis frases · ${S.phrases.length}</b><span>Lo que aprendiste cuando te trabaste</span></span><span>›</span></button>`:""}
 <button class="mode" data-go="settings"><span class="e">⚙️</span><span class="tx"><b>Ajustes</b><span>Voz, manos libres${inClaude?"":", clave de Gemini"}</span></span><span>›</span></button></div>
 ${s7.length>=2?`<div class="label">% en español, últimas sesiones</div><div class="card"><div class="chart">${recent(14).map(s=>`<div style="height:${Math.max(2,pct(s))}%"></div>`).join("")}</div></div>
 <div class="label">Palabras por turno</div><div class="card"><div class="chart w">${(()=>{const r=recent(14),mx=Math.max(4,...r.map(wpt));return r.map(s=>`<div style="height:${Math.max(2,wpt(s)/mx*100)}%"></div>`).join("")})()}</div></div>`:""}
 ${hasTTS&&!voice?`<div class="card" style="margin-top:12px"><b>No Spanish voice found</b><p class="hint">iPhone: Settings, Accessibility, Spoken Content, Voices, Spanish, download one. Android: add Spanish in Google Text to Speech. Then reopen.</p></div>`:""}`}

function program(){const c=cur();
 app.innerHTML=bar("El programa")+`<p class="hint" style="margin:4px 0 14px">Each topic is something that comes up when you walk up to someone. Each step adds weight: listen, answer, tell your version, hold a conversation, then do it at real speed. Pass a step and you gain 1 lb.</p>
 <div class="modes">${TOPICS.map((t,i)=>{const n=RUNGS.filter((_,r)=>S.passed[i+"-"+r]).length;return `<div class="mode" style="cursor:default"><span class="e">${t.e}</span><span class="tx"><b>${t.t}</b><span class="dots">${RUNGS.map((_,r)=>`<i class="${S.passed[i+"-"+r]?"on":c&&c.t===i&&c.r===r?"now":""}"></i>`).join("")}</span></span>${n?`<button class="pill" data-redo="${i}">Repetir</button>`:""}</div>`}).join("")}</div>`}

function paint(){const o=document.getElementById("orb"),st=document.getElementById("st");if(!o||!X)return;
 const m=X.busy?"think":micOn?"listen":X.talking?"talk":"you";o.className="orb "+m;o.textContent=m==="think"?"…":m==="listen"?"👂":m==="talk"?"🔊":"🎙️";
 if(st)st.textContent=m==="think"?"Pensando...":m==="listen"?"Te escucho...":m==="talk"?"Escucha":"Tu turno"}
function setScr(){const T=TOPICS[X.t],R=RUNGS[X.r],L=X.last;
 const goal=X.free?"":`<div class="goalrow"><div class="goal">${Array.from({length:R.need},(_,i)=>`<i class="${i<X.count?"on":""}"></i>`).join("")}</div></div>`;
 app.innerHTML=`<div class="bar"><button class="back" data-end aria-label="Terminar">←</button><h1>${T.e} ${X.free?"Charla libre":R.n}</h1><button class="pill" data-end>Terminar</button></div>
 ${goal}<p class="hint" style="text-align:center;margin-top:6px">${X.free?"Habla de lo que quieras.":R.how}</p>
 <div class="stage"><button id="orb" class="orb" data-orb aria-label="Hablar"></button><div id="st" class="state"></div>
 ${L?`<div class="said ${X.reveal?"":"blur"}">${esc(L.es)}</div>${X.pics&&L.chunks?chunkRow(L.chunks,false,X.reveal):""}
 <div class="acts"><button class="pill" data-again>🔁 Otra vez</button><button class="pill" data-slow>🐢 Despacio</button>${L.chunks?`<button class="pill" data-pics aria-pressed="${X.pics}">🖼️ Dibujos</button>`:""}<button class="pill" data-reveal aria-pressed="${X.reveal}">👁 Texto</button></div>`:""}
 ${X.err?`<p class="err">${esc(X.err)}</p>`:""}</div>
 ${X.rescue?rescueBox():X.mine?`<div class="mine"><span class="who">Tú</span><span>${esc(X.mine)}</span></div>`:""}
 ${!X.rescue?`<div style="margin-top:10px"><button class="pill" data-kit aria-pressed="${X.kit}">🧩 Piezas</button></div>${X.kit?`<div class="kit" style="margin-top:8px">${kitRow(T.kit)}<span class="who" style="text-align:center">Si te trabas</span>${kitRow(RESCUE)}</div>`:""}`:""}
 ${!X.rescue?`<div class="composer"><div class="rowc"><textarea id="dr" rows="2" lang="es" placeholder="${micOK?"Toca 🎙️ y habla":"Toca aquí y usa el 🎤 del teclado"}" autocapitalize="sentences">${esc(X.draft)}</textarea>${micOK?`<button class="micb ${micOn?"on":""}" data-mic aria-label="Hablar">${micOn?"■":"🎙️"}</button>`:""}<button class="send" data-send ${X.busy?"disabled":""} aria-label="Enviar">↑</button></div>
 ${!micOK&&S.sessions.length<3?`<p class="hint">Tap the box, switch to your Spanish keyboard (🌐), then tap the keyboard's 🎤 and talk. Stuck on a word? Say it in English. You'll get the Spanish and say it again before moving on.</p>`:""}</div>`:""}`;
 paint()}
function rescueBox(){const R=X.rescue,sc=R.score!==undefined?Math.round(R.score*100):null;
 return `<div class="rescue"><span class="who">Dilo en español</span>${R.chunks?chunkRow(R.chunks,true,true):`<span class="es">${esc(R.es)}</span>`}
 <button class="btn sec" data-say="${esc(R.es)}">🔊 Escuchar</button>
 ${sc!==null?`<p class="hint">Dijiste: ${esc(X.rtyped||"...")} · <span class="${sc>=70?"ok":"no"}">${sc}%</span></p>`:`<p class="hint">Look at the pieces, hear it, then say the whole thing.</p>`}
 ${sc!==null&&sc>=70?`<button class="btn pri" data-rdone>Seguir</button>`
 :`<div class="rowc"><textarea id="ry" rows="2" lang="es" placeholder="Dilo...">${esc(X.rtyped||"")}</textarea>${micOK?`<button class="micb ${micOn?"on":""}" data-rmic>${micOn?"■":"🎙️"}</button>`:""}<button class="send" data-rcheck aria-label="Revisar">✓</button></div>${R.tries>=2?`<button class="btn sec" data-rdone>Seguir de todos modos</button>`:""}`}</div>`}

function up(){const w=lb(),c=cur();
 app.innerHTML=`<div class="up"><div class="n">+1 lb</div><p class="big">${w} lb</p><p class="hint">${TOPICS[X.t].e} ${TOPICS[X.t].t} · ${RUNGS[X.r].n} ✓</p>
 ${X.stats.n?`<p>${pct(X.stats)}% en español · ${wpt(X.stats)} palabras por turno</p>`:""}
 ${c?`<button class="btn pri" data-train>Siguiente: ${RUNGS[c.r].n}${c.t!==X.t?" · "+TOPICS[c.t].t:""}</button>`:""}<button class="btn sec" data-go="home">Listo por ahora</button></div>`}
function recap(){const s=X.stats,prev=recent(8).slice(0,-1),avgPrev=prev.length?Math.round(prev.reduce((a,x)=>a+pct(x),0)/prev.length):null;
 app.innerHTML=bar("Resumen")+`<div class="card"><div class="stats" style="margin:0"><div class="stat"><b>${pct(s)}%</b><span>en español</span></div><div class="stat"><b>${wpt(s)}</b><span>palabras por turno</span></div><div class="stat"><b>${s.n}</b><span>turnos</span></div></div>
 ${!X.free?`<p>${RUNGS[X.r].n}: ${X.count} de ${RUNGS[X.r].need}. ${X.count?"Next time you pick up where you left off.":""}</p>`:""}
 ${avgPrev!==null?`<p class="hint">Your usual: ${avgPrev}% en español. ${pct(s)>avgPrev?"This one was better. ⬆️":"Keep going, it builds."}</p>`:""}
 <button class="btn pri" data-go="home">Listo</button></div>`;
 if(!X.free){S.prog[X.t+"-"+X.r]=X.count;save()}}

function phrases(){app.innerHTML=bar("Mis frases")+`<p class="hint" style="margin:4px 0 14px">Every time you got stuck and said it in English, the Spanish landed here. Tap to hear. Say them out loud.</p><div class="modes">${S.phrases.slice().reverse().map(p=>`<div class="card" style="padding:12px">${p.chunks?chunkRow(p.chunks,false,true):`<b>${esc(p.es)}</b>`}</div>`).join("")}</div>`}

function settings(){app.innerHTML=bar("Ajustes")+`<div class="card"><b>Velocidad de la voz</b>
 <div class="speeds">${[[.85,"Más lento"],[1,"Normal"],[1.15,"Más rápido"]].map(([r,l])=>`<button data-rate="${r}" aria-pressed="${S.rate==r}">${l}</button>`).join("")}</div>
 <b>Texto</b><p class="hint">"Solo escuchar" trains your ear. You can always peek.</p>
 <div class="speeds"><button data-showtext="0" aria-pressed="${!S.showText}">Solo escuchar</button><button data-showtext="1" aria-pressed="${S.showText}">Mostrar texto</button></div>
 ${micOK?`<b>Manos libres</b><p class="hint">After Sofi talks, the mic turns on by itself, like voice mode.</p><div class="speeds"><button data-hands="1" aria-pressed="${S.hands}">Sí</button><button data-hands="0" aria-pressed="${!S.hands}">No</button></div>`:""}
 <button class="btn sec" data-say="Hola, soy Sofi. ¿Cómo estás?">🔊 Probar voz</button></div>
 ${inClaude?`<p class="hint" style="margin-top:12px">Running on your Claude plan. ${DOC?"Progress saves to your Claude account.":""}</p>`:`<div class="label">Gemini (gratis)</div><div class="card">
 <ol class="steps"><li>Open <b>aistudio.google.com</b> and sign in with Google.</li><li>Tap <b>Get API key</b>, then <b>Create API key</b>.</li><li>Copy it and paste it here.</li></ol>
 <input type="text" id="gk" placeholder="Pega tu clave aquí" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.gkey)}">
 <button class="btn pri" data-savekey>Guardar y probar</button>${KS?`<p class="${KS.ok?"ok":"no"}" style="margin:0">${esc(KS.msg)}</p>`:""}
 <p class="hint">The key stays on this phone only.</p></div>`}`}
let KS=null;

// ================= EVENTS =================
app.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
 if(d.say!==undefined){speak(d.say,X&&screen==="set"?RUNGS[X.r].rate:.9);return}
 if(d.go){hush();screen=d.go;KS=null;render();scrollTo(0,0);return}
 if(d.train!==undefined){const c=cur();if(c)startSet(c.t,c.r);return}
 if(d.free!==undefined){const c=cur()||{t:0};startSet(c.t,3,true);return}
 if(d.redo!==undefined){startSet(+d.redo,3,true);return}
 if(d.end!==undefined){endSet();return}
 if(d.send!==undefined){const el=document.getElementById("dr");if(el)X.draft=el.value;send();return}
 if(d.mic!==undefined||d.orb!==undefined){if(micOK&&!X.busy&&!X.rescue)listen("dr");return}
 if(d.again!==undefined){speak(X.last.es,RUNGS[X.r].rate);return}
 if(d.slow!==undefined){speak(X.last.es,.65);return}
 if(d.pics!==undefined){X.pics=!X.pics;render();return}
 if(d.reveal!==undefined){X.reveal=!X.reveal;render();return}
 if(d.kit!==undefined){X.kit=!X.kit;render();return}
 if(d.rmic!==undefined){listen("ry");return}
 if(d.rcheck!==undefined){rescueCheck();return}
 if(d.rdone!==undefined){rescueDone();return}
 if(d.rate){S.rate=+d.rate;save();render();speak("Así hablo ahora.");return}
 if(d.showtext!==undefined){S.showText=d.showtext==="1";save();render();return}
 if(d.hands!==undefined){S.hands=d.hands==="1";save();render();return}
 if(d.savekey!==undefined){const k=(document.getElementById("gk").value||"").trim();if(!k)return;S.gkey=k;S.gmodel="";KS={ok:true,msg:"Probando..."};render();
  try{await pickModel();const r=await askJSON('Reply with ONLY JSON {"reply":"¡Hola!"}',[],null);KS={ok:!!(r&&r.reply),msg:r&&r.reply?"Funciona. Ya puedes entrenar.":"The key works but the reply was empty. Try again."}}catch(err){KS={ok:false,msg:errMsg(err)}}
  save();render();return}
});
render();
</script>
